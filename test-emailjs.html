<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmailJS Configuration Test - Arista Secondary School</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .config-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .config-item {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-test {
            background: #667eea;
            color: white;
        }
        .btn-test:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-check {
            background: #48bb78;
            color: white;
        }
        .btn-check:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .result.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .instructions {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ffeaa7;
        }
        .instructions h3 {
            color: #856404;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .instructions ol {
            margin-left: 20px;
            color: #856404;
        }
        .instructions li {
            margin-bottom: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 EmailJS Configuration Test</h1>
        <p class="subtitle">Arista Secondary School Contact Form</p>

        <div class="instructions">
            <h3>📋 Setup Instructions:</h3>
            <ol>
                <li>Go to <a href="https://dashboard.emailjs.com/" target="_blank">EmailJS Dashboard</a></li>
                <li>Get your Service ID, Template ID, and Public Key</li>
                <li>Enter them below and click "Check Configuration"</li>
                <li>If valid, click "Send Test Email"</li>
            </ol>
        </div>

        <div class="config-section">
            <div class="config-item">
                <label>Service ID:</label>
                <input type="text" id="serviceId" placeholder="e.g., service_abc123">
            </div>
            <div class="config-item">
                <label>Template ID:</label>
                <input type="text" id="templateId" placeholder="e.g., template_xyz789">
            </div>
            <div class="config-item">
                <label>Public Key:</label>
                <input type="text" id="publicKey" placeholder="e.g., user_abc123xyz">
            </div>
        </div>

        <div class="button-group">
            <button class="btn-check" onclick="checkConfig()">✓ Check Configuration</button>
            <button class="btn-test" onclick="sendTestEmail()">📧 Send Test Email</button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = message;
            resultDiv.className = `result ${type}`;
            resultDiv.style.display = 'block';
        }

        function checkConfig() {
            const serviceId = document.getElementById('serviceId').value.trim();
            const templateId = document.getElementById('templateId').value.trim();
            const publicKey = document.getElementById('publicKey').value.trim();

            if (!serviceId || !templateId || !publicKey) {
                showResult('❌ Please fill in all fields!', 'error');
                return;
            }

            if (serviceId.includes('YOUR_') || templateId.includes('YOUR_') || publicKey.includes('YOUR_')) {
                showResult('❌ Please replace placeholder values with actual credentials!', 'error');
                return;
            }

            showResult('✅ Configuration looks good! Click "Send Test Email" to test.', 'success');
        }

        async function sendTestEmail() {
            const serviceId = document.getElementById('serviceId').value.trim();
            const templateId = document.getElementById('templateId').value.trim();
            const publicKey = document.getElementById('publicKey').value.trim();

            if (!serviceId || !templateId || !publicKey) {
                showResult('❌ Please fill in all fields first!', 'error');
                return;
            }

            showResult('⏳ Sending test email...', 'info');

            const templateParams = {
                from_name: 'Test User',
                from_email: 'test@example.com',
                phone: '+91 9876543210',
                subject: 'Test Email - Configuration Check',
                message: 'This is a test email to verify EmailJS configuration for Arista Secondary School website.',
                to_email: 'mrspublicschool456@gmail.com',
                school_name: 'Arista Secondary School',
                reply_to: 'test@example.com',
                contact_date: new Date().toLocaleDateString('en-IN'),
                contact_time: new Date().toLocaleTimeString('en-IN')
            };

            try {
                const result = await emailjs.send(serviceId, templateId, templateParams, publicKey);
                console.log('Success:', result);
                showResult('✅ Test email sent successfully! Check mrspublicschool456@gmail.com inbox.', 'success');
            } catch (error) {
                console.error('Error:', error);
                showResult(`❌ Failed to send email: ${error.text || error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
